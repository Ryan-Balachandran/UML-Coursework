<!DOCTYPE html> 
<html> 
<head> 
    <meta charset="utf-8" />
    <title id="signup">Newsletter Signup</title> 
    <!--<link href="pages.css" rel="stylesheet">-->
    <link href="form.css" rel="stylesheet">
    <link href="submissionOverlay.css" rel="stylesheet">
    <script src="newsletterSubmit.js" defer></script>
    <script src="head.js" defer></script>
</head> 

<body> 
<header id="head"></header>
<form id="signup" name="signup" method="GET" action="newsletterSubmit.html">

    <div class="contactInfo">
        <h1>Newsletter Sign Up</h1>
        <p>Please fill in this form to receive the Studio Tech Talk newsletter.</p>
        <hr>
        <label for="firstName"><b>First Name*</b></label>
            <input id="firstName" type="text" placeholder="Enter First Name" name="firstName" required>
        <label for="lastName"><b>Last Name*</b></label>
            <input id="lastName" type="text" placeholder="Enter Last Name" name="lastName" required>
        <label for="email"><b>Email*</b></label>
            <input id="email" type="text" placeholder="Enter Email" name="email" required>
        <label id="age" for="age"><b>Age</b></label>
            <input type="text" placeholder="Enter Age (optional)" name="age">
        
        <div class="spacer">&nbsp</div>
        <hr>
        
        <label>Linux Experience</label>
        <fieldset id="experience">
            <label class="experienceLabel">
                <input name="experienceLevel" value="none" type="radio" />               
                <span>None</span>
            </label>  
            <label class="experienceLabel">
                <input name="experienceLevel" value="novice" type="radio" />               
                <span>Novice</span>
            </label>
            <label class="experienceLabel">               
                <input name="experienceLevel" value="intermediate" type="radio" />
                <span>Intermediate</span>
            </label>
            <label class="experienceLabel">                              
                <input name="experienceLevel" value="expert" type="radio"  />
                <span>Expert</span>
            </label>
        </fieldset>          
        <br>

        <label>Interests</label>
        <fieldset id="interests">
            <label class="interestsLabel">
                <input name="interests" value="music" type="checkbox" />               
                <span>Music</span>
            </label>
            <label class="interestsLabel">
                <input name="interests" value="video" type="checkbox" />               
                <span>Video</span>
            </label>
            <label class="interestsLabel">               
                <input name="interests" value="graphics" type="checkbox" />
                <span>Graphics</span>
            </label>
            <label class="interestsLabel">                              
                <input name="interests" value="photography" type="checkbox"  />
                <span>Photography</span>
            </label>
            <label class="interestsLabel">                              
                <input name="interests" value="publishing" type="checkbox"  />
                <span>Publishing</span>
            </label>
        </fieldset>           
        <br>
        
        <label>Which other audio software packages have you used</label>
        <fieldset id="other">
            <label class="otherLabel">
                <input name="other" value="protools" type="checkbox" />               
                <span>ProTools</span>
            </label>
            <label class="otherLabel">
                <input name="other" value="logic" type="checkbox" />               
                <span>Logic</span>
            </label>
            <label class="otherLabel">               
                <input name="other" value="reason" type="checkbox" />
                <span>Reason</span>
            </label>
            <label class="otherLabel">                              
                <input name="other" value="audacity" type="checkbox"  />
                <span>Audacity</span>
            </label><br>
            <label class="otherLabel">                              
                <input name="other" value="ableton" type="checkbox"  />
                <span>Ableton</span>
            </label>
            <label class="otherLabel">                              
                <input name="other" value="cubase" type="checkbox"  />
                <span>Cubase</span>
            </label>
            <label class="otherLabel">                              
                <input name="other" value="presonus" type="checkbox"  />
                <span>Presonus</span>
            </label>
            <label class="otherLabel">                              
                <input name="other" value="bitwig" type="checkbox"  />
                <span>Bitwig</span>
            </label>
       </fieldset>           
  <br>
  <hr>
      <div class="buttons">
        <button type="button" id="cancelBtn">Not Now</button>
        <button type="submit" id="signupBtn">Sign Up</button>
      </div>
    </div>
  </form> 
<footer id="foot"></footer>
</body> 
</html>
